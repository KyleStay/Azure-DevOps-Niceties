name: Verify extension
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run check:public
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run package
      - name: Verify exact upload ZIP
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, shutil, subprocess, tempfile, zipfile
          root = pathlib.Path.cwd()
          version = json.loads((root / "manifest.json").read_text())["version"]
          extracted = tempfile.mkdtemp(prefix="azure-packaged-extension-")
          try:
              with zipfile.ZipFile(root / "release" / version / f"azure-devops-niceties-{version}.zip") as archive:
                  archive.extractall(extracted)
              subprocess.run(["npm", "run", "test:browser"], check=True,
                             env={**os.environ, "AZURE_NICETIES_EXTENSION": extracted})
          finally:
              shutil.rmtree(extracted)
          PYTHON
      - run: npm run test:publisher
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa-${{ github.run_id }}
          retention-days: 3
          if-no-files-found: ignore
          path: |
            /tmp/azure-inline-state-menu.png
            /tmp/azure-state-list-compatibility.png
            /tmp/azure-native-sprint-state.png
            /tmp/azure-state-normal.png
            /tmp/azure-state-hover.png
            /tmp/azure-state-form-refresh.png
            /tmp/azure-release-list.png
            /tmp/azure-release-legacy-layout.png
            /tmp/azure-release-layout-360.png
            /tmp/azure-release-layout-836.png
            /tmp/azure-release-nested-360.png
            /tmp/azure-release-nested-836.png
            /tmp/azure-release-nested-1280.png
            /tmp/azure-release-bolt-360.png
            /tmp/azure-release-bolt-836.png
            /tmp/azure-release-bolt-1280.png
            /tmp/azure-release-selection-demo.png
            /tmp/azure-publisher-package.png
            store/assets/settings-*-1280x800.png
